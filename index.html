<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <title>Chatbot MVC</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2"></script>
  <link rel="stylesheet" href="css/styles.css" />
  <!-- Emoji Picker -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/dist/emoji-picker.min.css" />
  <script type="module">
    import 'https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js';
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

</head>

<body>
  <div class="main-wrapper whatsapp-bg">
    <div id="chat-container" class="whatsapp-container">
      <div id="chat-header" class="whatsapp-header">
        <img src="css/img/fondo.jpg" alt="Avatar" class="avatar" />
        <span class="chat-title">Chatbot</span>
      </div>
      <div id="chat-window" class="d-flex flex-column whatsapp-window">
        <!-- Mensajes -->
      </div>
      <div id="chat-input-container" class="whatsapp-input-container">
        <button id="emoji-btn" class="btn btn-light">😊</button>
        <input type="text" id="user-input" class="form-control whatsapp-input"
          placeholder="Escribe un mensaje o emoji..." />
        <button id="send-btn" class="btn btn-success whatsapp-send">
          <i class="bi bi-send-fill"></i>
        </button>
        <emoji-picker id="emoji-picker"
          style="display:none; position:absolute; bottom:60px; right:20px;"></emoji-picker>

      </div>
    </div>
  </div>

  <!-- Scripts del chatbot -->
  <script src="js/model.js"></script>
  <script src="js/view.js"></script>
  <script src="js/controller.js"></script>
  <script>
    // Emoji picker logic
    const emojiBtn = document.getElementById('emoji-btn');
    const emojiPicker = document.getElementById('emoji-picker');
    const userInput = document.getElementById('user-input');
    emojiBtn.addEventListener('click', () => {
      emojiPicker.style.display = emojiPicker.style.display === 'none' ? 'block' : 'none';
    });
    emojiPicker.addEventListener('emoji-click', e => {
      userInput.value += e.detail.unicode;
      emojiPicker.style.display = 'none';
      userInput.focus();
    });
    document.addEventListener('click', (e) => {
      if (!emojiPicker.contains(e.target) && e.target !== emojiBtn) {
        emojiPicker.style.display = 'none';
      }
    });
  </script>
</body>

</html>
